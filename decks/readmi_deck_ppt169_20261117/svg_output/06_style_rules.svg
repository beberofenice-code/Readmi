<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="en" font-family="Segoe UI, Arial, sans-serif" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B1020"/>
  <g id="header" data-pptx-bounds="60 40 1160 110">
    <text x="60" y="72" font-family="Consolas, monospace" font-size="14" fill="#3DD6F5" letter-spacing="2">THE STYLE BIBLE</text>
    <text x="60" y="124" font-size="40" font-weight="bold" fill="#FFFFFF">Rules measured from 20 reference shorts</text>
  </g>
  <g id="formula" data-pptx-bounds="60 160 1160 190">
    <text x="60" y="186" font-family="Consolas, monospace" font-size="14" fill="#8C8FFF">SCRIPT FORMULA · 20 OF 20 VIDEOS FOLLOW IT</text>
    <line x1="100" y1="236" x2="1180" y2="236" stroke="#3B3F8F" stroke-width="2"/>
    <g fill="#141B2E" stroke="#8C8FFF" stroke-width="2">
      <circle cx="100" cy="236" r="12"/>
      <circle cx="316" cy="236" r="12"/>
      <circle cx="532" cy="236" r="12"/>
      <circle cx="748" cy="236" r="12"/>
      <circle cx="964" cy="236" r="12"/>
    </g>
    <circle cx="1180" cy="236" r="14" fill="#FFB547"/>
    <g font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      <text x="60" y="284" text-anchor="start">Hook</text>
      <text x="316" y="284">Setting</text>
      <text x="532" y="284">Escalation</text>
      <text x="748" y="284">Mystery</text>
      <text x="964" y="284">“You see,”</text>
      <text x="1160" y="284" fill="#FFB547">Payoff</text>
    </g>
    <g font-size="14" fill="#9AA3B8" text-anchor="middle">
      <text x="60" y="312" text-anchor="start">a paradox, no setup</text>
      <text x="316" y="312">1–2 concrete lines</text>
      <text x="532" y="312">3–6 beats, stakes climb</text>
      <text x="748" y="312">one “Wait…?” beat</text>
      <text x="964" y="312">pivot to the mechanism</text>
      <text x="1150" y="312">ironic last line</text>
    </g>
  </g>
  <g id="metric-pace" data-pptx-bounds="60 380 270 260">
    <rect x="60" y="384" width="270" height="2" fill="#2A3350"/>
    <text x="60" y="456" font-size="56" font-weight="bold" fill="#FFB547">3.7</text>
    <text x="60" y="490" font-family="Consolas, monospace" font-size="14" fill="#E6E9F2">WORDS PER SECOND</text>
    <text x="60" y="530" font-size="16" fill="#C9CFDD">One fast, steady narrator<tspan x="60" dy="24">with almost no pauses.</tspan></text>
  </g>
  <g id="metric-holds" data-pptx-bounds="356 380 270 260">
    <rect x="356" y="384" width="270" height="2" fill="#2A3350"/>
    <text x="356" y="456" font-size="56" font-weight="bold" fill="#FFFFFF">~80%</text>
    <text x="356" y="490" font-family="Consolas, monospace" font-size="14" fill="#E6E9F2">OF FRAMES, CAMERA HOLDS</text>
    <text x="356" y="530" font-size="16" fill="#C9CFDD">Moves are short ease-out<tspan x="356" dy="24">bursts, not constant drift.</tspan></text>
  </g>
  <g id="metric-dissolve" data-pptx-bounds="652 380 270 260">
    <rect x="652" y="384" width="270" height="2" fill="#2A3350"/>
    <text x="652" y="456" font-size="56" font-weight="bold" fill="#FFFFFF">6–8</text>
    <text x="652" y="490" font-family="Consolas, monospace" font-size="14" fill="#E6E9F2">FRAME DISSOLVES</text>
    <text x="652" y="530" font-size="16" fill="#C9CFDD">Hard cuts almost never;<tspan x="652" dy="24">places change by crossfade.</tspan></text>
  </g>
  <g id="metric-start" data-pptx-bounds="948 380 272 260">
    <rect x="948" y="384" width="272" height="2" fill="#2A3350"/>
    <text x="948" y="456" font-size="56" font-weight="bold" fill="#FFFFFF">1–4</text>
    <text x="948" y="490" font-family="Consolas, monospace" font-size="14" fill="#E6E9F2">FRAME WHEN VOICE STARTS</text>
    <text x="948" y="530" font-size="16" fill="#C9CFDD">No intro, logo, outro or<tspan x="948" dy="24">call to action.</tspan></text>
  </g>
  <g id="footnote" data-pptx-bounds="60 650 1160 36">
    <text x="60" y="676" font-family="Consolas, monospace" font-size="14" fill="#9AA3B8">Source: references/STYLE_BIBLE.md in the cartoon-3d-short-v2 skill</text>
  </g>
</svg>
