<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="en" font-family="Segoe UI, Arial, sans-serif" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B1020"/>
  <g id="header" data-pptx-bounds="60 40 560 160">
    <text x="60" y="72" font-family="Consolas, monospace" font-size="14" fill="#3DD6F5" letter-spacing="2">THE WORKED EXAMPLE</text>
    <text x="60" y="124" font-size="40" font-weight="bold" fill="#FFFFFF">How the Dashcam<tspan x="60" dy="50">Was Invented</tspan></text>
  </g>
  <g id="story-summary" data-pptx-bounds="60 214 540 160">
    <text x="60" y="244" font-size="18" fill="#C9CFDD">A scammer brake-checks drivers on the highway, fakes<tspan x="60" dy="28">neck injuries and collects insurance payouts, until a</tspan><tspan x="60" dy="28">quiet driver points at a little camera taped to his</tspan><tspan x="60" dy="28">windshield. Payoff: “And that’s how the dashcam</tspan><tspan x="60" dy="28">was invented.”</tspan></text>
  </g>
  <g id="film-stats" data-pptx-bounds="60 400 540 260">
    <line x1="60" y1="404" x2="580" y2="404" stroke="#2A3350" stroke-width="1"/>
    <g id="stat-length">
      <text x="60" y="466" font-size="56" font-weight="bold" fill="#FFB547">62.2 s</text>
      <text x="60" y="494" font-family="Consolas, monospace" font-size="14" fill="#9AA3B8">1,867 frames @ 30 fps</text>
    </g>
    <g id="stat-shots">
      <text x="330" y="466" font-size="56" font-weight="bold" fill="#FFFFFF">12</text>
      <text x="330" y="494" font-family="Consolas, monospace" font-size="14" fill="#9AA3B8">shots</text>
    </g>
    <g id="stat-sets">
      <text x="460" y="466" font-size="56" font-weight="bold" fill="#FFFFFF">5</text>
      <text x="460" y="494" font-family="Consolas, monospace" font-size="14" fill="#9AA3B8">sets</text>
    </g>
    <text x="60" y="556" font-size="18" fill="#C9CFDD">Sets: car cabin, highway, driveway, office, pool.<tspan x="60" dy="28">Voices: narrator, insurance agent, scammer.</tspan></text>
  </g>
  <g id="story-beats" data-pptx-bounds="640 40 600 640">
    <g id="beat-setup">
      <image href="../images/shot_03_f210.jpg" x="640" y="60" width="180" height="320" preserveAspectRatio="xMidYMid slice"/>
      <text x="640" y="414" font-family="Consolas, monospace" font-size="14" fill="#FFB547">01 · THE SCAM</text>
      <text x="640" y="442" font-size="16" fill="#C9CFDD">Faked crashes on the<tspan x="640" dy="24">highway (shot 3)</tspan></text>
    </g>
    <g id="beat-escalation">
      <image href="../images/shot_07_f1010.jpg" x="850" y="60" width="180" height="320" preserveAspectRatio="xMidYMid slice"/>
      <text x="850" y="414" font-family="Consolas, monospace" font-size="14" fill="#FFB547">02 · THE CALL</text>
      <text x="850" y="442" font-size="16" fill="#C9CFDD">The insurer calls<tspan x="850" dy="24">(office, shot 7)</tspan></text>
    </g>
    <g id="beat-payoff">
      <image href="../images/shot_12_f1756.jpg" x="1060" y="60" width="180" height="320" preserveAspectRatio="xMidYMid slice"/>
      <text x="1060" y="414" font-family="Consolas, monospace" font-size="14" fill="#FFB547">03 · THE CAMERA</text>
      <text x="1060" y="442" font-size="16" fill="#C9CFDD">Dashcam HUD reveal<tspan x="1060" dy="24">(shot 12)</tspan></text>
    </g>
    <line x1="640" y1="506" x2="1240" y2="506" stroke="#2A3350" stroke-width="1"/>
    <text x="640" y="546" font-size="18" fill="#C9CFDD">Every sentence of the script is illustrated literally,<tspan x="640" dy="28">and the light changes with the story: day, golden</tspan><tspan x="640" dy="28">hour, night, then rain for the payoff.</tspan></text>
  </g>
</svg>
