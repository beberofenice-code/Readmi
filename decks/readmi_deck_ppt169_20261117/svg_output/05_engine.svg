<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="en" font-family="Segoe UI, Arial, sans-serif" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B1020"/>
  <g id="header" data-pptx-bounds="60 40 1160 110">
    <text x="60" y="72" font-family="Consolas, monospace" font-size="14" fill="#3DD6F5" letter-spacing="2">THE ENGINE · src/videos/core</text>
    <text x="60" y="124" font-size="40" font-weight="bold" fill="#FFFFFF">About 3,650 lines of TypeScript draw every frame</text>
  </g>
  <g id="lead" data-pptx-bounds="60 150 1160 50">
    <text x="60" y="184" font-size="20" fill="#C9CFDD">Eleven core modules, grouped by job. A story folder adds only its script, shot table and sets.</text>
  </g>
  <g id="group-look" data-pptx-bounds="60 220 360 400">
    <rect x="60" y="220" width="4" height="380" fill="#FFB547"/>
    <text x="84" y="250" font-size="24" font-weight="bold" fill="#FFFFFF">Look</text>
    <text x="84" y="276" font-size="16" fill="#9AA3B8">The painted, outlined cartoon finish</text>
    <g font-family="Consolas, monospace" font-size="16">
      <g><text x="84" y="330" fill="#E6E9F2">toon.ts</text><text x="390" y="330" fill="#FFB547" text-anchor="end">909</text></g>
      <g><text x="84" y="372" fill="#E6E9F2">paint.ts</text><text x="390" y="372" fill="#FFB547" text-anchor="end">720</text></g>
      <g><text x="84" y="414" fill="#E6E9F2">ink.ts</text><text x="390" y="414" fill="#FFB547" text-anchor="end">393</text></g>
      <g><text x="84" y="456" fill="#E6E9F2">lensblur.ts</text><text x="390" y="456" fill="#FFB547" text-anchor="end">139</text></g>
    </g>
    <text x="84" y="520" font-size="16" fill="#C9CFDD">Toon shading, hand-painted<tspan x="84" dy="24">textures, black ink outlines on</tspan><tspan x="84" dy="24">3D geometry, depth of field.</tspan></text>
  </g>
  <g id="group-light" data-pptx-bounds="460 220 360 400">
    <rect x="460" y="220" width="4" height="380" fill="#8C8FFF"/>
    <text x="484" y="250" font-size="24" font-weight="bold" fill="#FFFFFF">Light</text>
    <text x="484" y="276" font-size="16" fill="#9AA3B8">Five moods and the color grade</text>
    <g font-family="Consolas, monospace" font-size="16">
      <g><text x="484" y="330" fill="#E6E9F2">grade.ts</text><text x="790" y="330" fill="#8C8FFF" text-anchor="end">152</text></g>
      <g><text x="484" y="372" fill="#E6E9F2">lights.ts</text><text x="790" y="372" fill="#8C8FFF" text-anchor="end">98</text></g>
      <g><text x="484" y="414" fill="#E6E9F2">cardshade.ts</text><text x="790" y="414" fill="#8C8FFF" text-anchor="end">85</text></g>
      <g><text x="484" y="456" fill="#E6E9F2">shade.ts</text><text x="790" y="456" fill="#8C8FFF" text-anchor="end">77</text></g>
    </g>
    <text x="484" y="520" font-size="16" fill="#C9CFDD">Day, golden, night, interior and<tspan x="484" dy="24">rain modes, each with its own</tspan><tspan x="484" dy="24">lighting and grade.</tspan></text>
  </g>
  <g id="group-build" data-pptx-bounds="860 220 360 400">
    <rect x="860" y="220" width="4" height="380" fill="#3DD6F5"/>
    <text x="884" y="250" font-size="24" font-weight="bold" fill="#FFFFFF">Build and rig</text>
    <text x="884" y="276" font-size="16" fill="#9AA3B8">Scenes, characters and overlays</text>
    <g font-family="Consolas, monospace" font-size="16">
      <g><text x="884" y="330" fill="#E6E9F2">build.ts</text><text x="1190" y="330" fill="#3DD6F5" text-anchor="end">704</text></g>
      <g><text x="884" y="372" fill="#E6E9F2">rig25d.ts</text><text x="1190" y="372" fill="#3DD6F5" text-anchor="end">278</text></g>
      <g><text x="884" y="414" fill="#E6E9F2">OverlayLayer.tsx</text><text x="1190" y="414" fill="#3DD6F5" text-anchor="end">96</text></g>
    </g>
    <text x="884" y="520" font-size="16" fill="#C9CFDD">Scene assembly, the hybrid 2.5D<tspan x="884" dy="24">character rig, and the dashcam</tspan><tspan x="884" dy="24">HUD and pop-caption overlays.</tspan></text>
  </g>
  <g id="footnote" data-pptx-bounds="60 640 1160 40">
    <text x="60" y="668" font-family="Consolas, monospace" font-size="14" fill="#9AA3B8">Numbers are lines of code per file · stack: Remotion 4, React 19, three 0.187, @react-three/fiber 9</text>
  </g>
</svg>
