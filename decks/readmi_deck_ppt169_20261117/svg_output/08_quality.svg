<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="en" font-family="Segoe UI, Arial, sans-serif" data-pptx-page-role="content">
  <defs>
    <radialGradient id="zeroGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3DD6F5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3DD6F5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B1020"/>
  <g id="header" data-pptx-bounds="60 40 1160 110">
    <text x="60" y="72" font-family="Consolas, monospace" font-size="14" fill="#3DD6F5" letter-spacing="2">AUTOMATED QA · out/dashcam/qa/report.md</text>
    <text x="60" y="124" font-size="40" font-weight="bold" fill="#FFFFFF">The final cut passed every automated check</text>
  </g>
  <g id="hero-zero" data-pptx-bounds="60 170 500 480">
    <circle cx="250" cy="340" r="190" fill="url(#zeroGlow)"/>
    <circle cx="250" cy="340" r="140" fill="none" stroke="#3DD6F5" stroke-width="2"/>
    <text x="250" y="390" font-size="150" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0</text>
    <text x="60" y="580" font-size="20" font-weight="bold" fill="#FFFFFF">defects found in 1,867 frames</text>
    <text x="60" y="610" font-size="16" fill="#C9CFDD">No black, unplanned white or frozen frames,<tspan x="60" dy="24">no unplanned pops, no silences.</tspan></text>
  </g>
  <g id="metrics" data-pptx-bounds="620 170 600 470">
    <g id="metric-loudness">
      <text x="620" y="220" font-size="44" font-weight="bold" fill="#FFB547">−15.1 LUFS</text>
      <text x="620" y="250" font-size="16" fill="#C9CFDD">Integrated loudness (range 6.2 LU), near the −14 LUFS target</text>
    </g>
    <line x1="620" y1="284" x2="1220" y2="284" stroke="#2A3350" stroke-width="1"/>
    <g id="metric-peak">
      <text x="620" y="344" font-size="44" font-weight="bold" fill="#FFFFFF">−1.0 dBFS</text>
      <text x="620" y="374" font-size="16" fill="#C9CFDD">Peak level after the BS.1770-4 mastering limiter</text>
    </g>
    <line x1="620" y1="408" x2="1220" y2="408" stroke="#2A3350" stroke-width="1"/>
    <g id="metric-held">
      <text x="620" y="468" font-size="44" font-weight="bold" fill="#FFFFFF">3%</text>
      <text x="620" y="498" font-size="16" fill="#C9CFDD">Held frames (47 of 1,867): the picture keeps moving</text>
    </g>
    <line x1="620" y1="532" x2="1220" y2="532" stroke="#2A3350" stroke-width="1"/>
    <g id="metric-format">
      <text x="620" y="584" font-family="Consolas, monospace" font-size="16" fill="#E6E9F2">1080×1920 · 30 fps · AAC 48 kHz stereo</text>
      <text x="620" y="612" font-size="16" fill="#9AA3B8">Earlier QA flags in shots 5, 10 and 12 were fixed before this render.</text>
    </g>
  </g>
</svg>
